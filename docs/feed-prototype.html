  sam:{name:'Sam Rivera',initials:'SR',background:'#e7eee9',color:'#53735c',bio:'Notes, prototypes and things that work locally.'},
  you:{name:'You',initials:'YO',background:'#ecebe7',color:'#686357',bio:'A member of the group.'}
};
const initialPosts=[
  {id:'voice-notes',bookmarks:8,author:'alex',time:'2h',title:'Voice notes, finally searchable.',summary:'A small app that transcribes voice notes and makes them searchable by meaning. The recordings and processing stay on your laptop.',project:'Noted',domain:'A local-first voice note library',mark:'n.',detail:'Alex built this to find ideas recorded on walks without listening through every note. Search works even when the exact wording is forgotten.\n\nBuilt over a weekend with Whisper and a small local embedding model.',question:'Can someone try it, or is it still a personal tool?',comments:[{id:1,author:'sam',text:'The search-by-meaning part is exactly what I’ve been missing. Does it handle a mix of languages?',time:'1h'},{id:2,author:'alex',text:'Yes, I’ve been using it with English and Mandarin in the same note.',time:'48m'},{id:3,author:'maya',text:'Would love to try this when you share it.',time:'25m'}]},
  {id:'reading-margin',bookmarks:14,author:'maya',time:'4h',title:'An assistant that stays in the margin.',summary:'Highlight a passage in an article and ask about it without leaving the page. The answer includes the lines it used, so you can check it as you read.',project:'Margin',domain:'A browser companion for close reading',mark:'m',detail:'Maya built Margin to help with dense articles without moving the conversation into another tab. Margin sits next to the text and keeps every answer tied to the passage you selected.\n\nIt’s a small browser extension, built around a very ordinary reading habit.',comments:[{id:4,author:'julien',text:'Keeping the source lines visible is a nice touch.',time:'3h'},{id:5,author:'sam',text:'I can see myself using this for papers.',time:'2h'}]},
  {id:'meeting-tasks',bookmarks:5,author:'julien',time:'6h',title:'Meeting notes in. A task list out.',summary:'A workflow that pulls decisions, owners and due dates out of meeting notes. Every task is yours to review before it goes into your task manager.',project:'Notes to tasks',domain:'A review-first meeting workflow',mark:'↳',detail:'Julien focused on making the review step quick. Each task sits beside the sentence it came from, and I can change the owner or date before exporting.\n\nIt’s being used for Julien’s own meetings first.',comments:[{id:6,author:'nina',text:'Which task manager are you exporting to?',time:'4h'}]},
  {id:'palette-tool',bookmarks:21,author:'nina',time:'Yesterday',title:'Colour palettes from a sentence.',summary:'Describe a mood and get a few palettes ready to use. Each comes with contrast checks and CSS variables you can copy into your project.',project:'Undertone',domain:'Small palettes, ready for the web',mark:'u',detail:'Nina’s tool uses the prompt as a starting point, then applies a simple constraint: every palette has a text colour, surface colour and accent with contrast checked.\n\nYou can tweak the colours and copy the variables directly into a stylesheet.',comments:[{id:7,author:'maya',text:'The CSS export makes this useful straight away.',time:'Yesterday'},{id:8,author:'alex',text:'I’d use this for small prototypes.',time:'Yesterday'}]},
  {id:'paper-map',bookmarks:12,author:'sam',time:'Yesterday',title:'A map of the papers on your desk.',summary:'Drop in a folder of PDFs. This local app groups related papers, explains the connections and links every note back to a page in the original.',project:'Paper trail',domain:'Find the connections in your reading',mark:'p',detail:'Sam built this to find half-remembered papers. It presents small groups of related ideas with the page references that connect them.\n\nThe files and index stay local.',comments:[]}
];
let posts=structuredClone(initialPosts),saved=new Set(),role='visitor',sort='latest',search='',searchOpen=false;
let route={view:'feed'},toastTimer,pendingAction=null;
const scrollPositions=new Map();let internalDepth=0;
const main=document.getElementById('main'),modal=document.getElementById('modal');
const currentUser=()=>role==='author'?'alex':'you';
const avatar=(id,cls='')=>{const p=people[id];return `<span class="avatar ${cls}" style="background:${p.background};color:${p.color}">${p.initials}</span>`};
const userButton=(id,cls='')=>`<button type="button" class="avatar-button" data-action="profile" data-id="${id}" aria-label="View ${escapeHTML(people[id].name)}’s profile">${avatar(id,cls)}</button>`;
function notify(message){const t=document.getElementById('toast');clearTimeout(toastTimer);t.textContent=message;t.classList.add('show');toastTimer=setTimeout(()=>t.classList.remove('show'),2600)}
function updateHeader(){
  document.querySelectorAll('[data-route]').forEach(b=>b.classList.toggle('active',b.dataset.route===route.view));
  document.querySelector('[data-route="mine"]').hidden=role==='visitor';
  const user=currentUser();
  document.getElementById('account').innerHTML=role==='visitor'?'<button type="button" class="signin" data-action="signin">Sign in</button>':`<button type="button" class="avatar-button" data-action="account" aria-label="Your account">${avatar(user)}</button>`;
  document.getElementById('preview-role').value=role;
  const pending=posts.some(p=>p.author===currentUser()&&p.question);
  document.querySelector('.nav-dot').hidden=role==='visitor'||!pending;
}
function projectLink(post){return `<button type="button" class="project-link" data-action="project" data-id="${post.id}" aria-label="Open ${escapeHTML(post.project)} project link"><span class="project-symbol">${escapeHTML(post.mark)}</span><span class="project-info"><strong>${escapeHTML(post.project)}</strong><span>${escapeHTML(post.domain)}</span></span>${icon('arrow')}</button>`}
function postActions(post){return `<div class="actions"><button type="button" class="quiet-action" data-action="comments" data-id="${post.id}" aria-label="${post.comments.length} ${post.comments.length===1?'comment':'comments'} on ${escapeHTML(post.title)}">${icon('comment')}<span>${post.comments.length?post.comments.length+' '+(post.comments.length===1?'comment':'comments'):'Start a conversation'}</span></button><span class="spacer"></span><button type="button" class="share-button" data-action="share" data-id="${post.id}" aria-label="Share ${escapeHTML(post.title)}">${icon('share')}</button><button type="button" class="save-button ${saved.has(post.id)?'saved':''}" data-action="save" data-id="${post.id}" aria-label="${saved.has(post.id)?'Unsave':'Save'} ${escapeHTML(post.title)}" aria-pressed="${saved.has(post.id)}">${icon('bookmark')}</button></div>`}
function postHeading(post){return `<div class="post-heading">${userButton(post.author)}<div class="byline"><button type="button" class="author-name" data-action="profile" data-id="${post.author}">${escapeHTML(people[post.author].name)}</button><span class="byline-dot"></span><span class="post-time">${post.time}</span></div><button type="button" class="icon-button" data-action="menu" data-id="${post.id}" aria-label="Options for ${escapeHTML(post.title)}">${icon('more')}</button></div>`}
function ownerPrompt(post){return role!=='visitor'&&post.author===currentUser()&&post.question?`<button type="button" class="owner-prompt" data-action="question" data-id="${post.id}">${icon('spark')}<span>One detail would help. Add an answer.</span>${icon('chevron')}</button>`:''}
function postRow(post){return `<article class="post" aria-label="${escapeHTML(post.title)}">${postHeading(post)}<div class="post-content"><button type="button" class="post-title" data-action="post" data-id="${post.id}">${escapeHTML(post.title)}</button><p class="post-summary">${escapeHTML(post.summary)}</p>${projectLink(post)}${ownerPrompt(post)}${postActions(post)}${route.view==='mine'?`<div class="owner-actions"><button type="button" data-action="edit" data-id="${post.id}">Edit post</button><button type="button" data-action="remove" data-id="${post.id}">Remove</button></div>`:''}</div></article>`}
function emptyState(title,text,kind='search'){return `<div class="empty"><div class="empty-icon">${icon(kind)}</div><h2>${title}</h2><p>${text}</p><button type="button" class="text-button" data-action="reset-feed">Back to the feed</button></div>`}
function matchingPosts(){let list=posts.filter(p=>route.view!=='saved'||saved.has(p.id));if(route.view==='mine')list=list.filter(p=>p.author===currentUser());if(route.view==='profile')list=list.filter(p=>p.author===route.id);if(search&&(route.view==='feed'||route.view==='saved')){const q=search.toLowerCase();list=list.filter(p=>[p.title,p.summary,people[p.author].name,p.project].join(' ').toLowerCase().includes(q))}if(['feed','saved'].includes(route.view)){if(sort==='comments')list.sort((a,b)=>b.comments.length-a.comments.length);if(sort==='bookmarks')list.sort((a,b)=>(b.bookmarks+Number(saved.has(b.id)))-(a.bookmarks+Number(saved.has(a.id))))}return list}
function renderList(){const list=matchingPosts(),target=document.getElementById('feed-list');if(!target)return;target.innerHTML=list.length?list.map(postRow).join('')+'<div class="end-of-feed">'+icon('check')+'<span>You’re all caught up.</span></div>':search?emptyState('Nothing here yet.','Try a different word, project or person.'):route.view==='saved'?emptyState('Good finds, kept close.','Save a project from the feed to come back to it later.','bookmark'):emptyState('Your work belongs here.','Projects shared from your Telegram account will appear here.','user')}
function renderFeed(){const isSaved=route.view==='saved';main.innerHTML=`<div class="feed-header"><div class="heading-line"><h1>${isSaved?'Saved':'From the group'}</h1><div class="feed-controls"><label class="sort-control"><span class="visually-hidden">Sort posts</span><select id="feed-sort"><option value="latest">Newest</option><option value="comments">Most commented</option><option value="bookmarks">Most bookmarked</option></select><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="m4 6 4 4 4-4"/></svg></label><button type="button" class="icon-button ${searchOpen?'active':''}" data-action="search" aria-label="Search projects" aria-expanded="${searchOpen}">${icon('search')}</button></div></div><p class="feed-subtitle">${isSaved?'Projects to come back to.':'Projects shared in our Telegram group.'}</p><div class="search-box" ${searchOpen?'':'hidden'}><input id="search-input" type="search" aria-label="Search projects and people" placeholder="Search projects or people…" value="${escapeHTML(search)}" autocomplete="off"><button type="button" class="icon-button" data-action="close-search" aria-label="Close search">${icon('close')}</button></div></div><div id="feed-list"></div>`;const select=document.getElementById('feed-sort');select.value=sort;const resizeSort=()=>select.style.width=({latest:80,comments:142,bookmarks:150})[sort]+'px';resizeSort();select.addEventListener('change',()=>{sort=select.value;resizeSort();renderList()});renderList();document.getElementById('search-input').addEventListener('input',e=>{search=e.target.value;renderList()})}
function renderProfile(){const p=people[route.id];if(!p){go({view:'feed'});return}main.innerHTML=`<div class="detail-nav"><button type="button" class="icon-button" data-action="back" aria-label="Go back">${icon('back')}</button><span>Profile</span></div><div class="profile-header">${avatar(route.id,'large')}<h1>${escapeHTML(p.name)}</h1><p>${escapeHTML(p.bio)}</p><div class="profile-meta">${posts.filter(post=>post.author===route.id).length} shared ${posts.filter(post=>post.author===route.id).length===1?'project':'projects'}</div></div><div class="section-label">Projects</div><div id="feed-list"></div>`;renderList()}
function renderMine(){main.innerHTML='<div class="owner-header"><div><h1>Your posts</h1><p>Your projects, with room for the missing details.</p></div></div><div id="feed-list"></div>';renderList()}
function commentRow(c){return `<article class="comment">${userButton(c.author,'tiny')}<div class="comment-body"><div class="byline"><button type="button" class="author-name" data-action="profile" data-id="${c.author}">${escapeHTML(people[c.author].name)}</button><span class="byline-dot"></span><span class="post-time">${c.time}</span></div><p>${escapeHTML(c.text)}</p></div>${role!=='visitor'&&c.author===currentUser()?`<button type="button" class="icon-button" data-action="delete-comment" data-id="${c.id}" aria-label="Delete your comment">${icon('trash')}</button>`:''}</article>`}
function renderPost(){const p=posts.find(p=>p.id===route.id);if(!p){main.innerHTML='<div class="detail-nav"><button type="button" class="icon-button" data-action="back" aria-label="Back">'+icon('back')+'</button><span>Post</span></div>'+emptyState('This post is no longer here.','The author may have removed it.');return}main.innerHTML=`<div class="detail-nav"><button type="button" class="icon-button" data-action="back" aria-label="Go back">${icon('back')}</button><span>Post</span><small>From the group</small></div><article class="detail-post">${postHeading(p)}<div class="post-content"><h1 class="post-title">${escapeHTML(p.title)}</h1><p class="post-summary">${escapeHTML(p.summary)}</p>${p.detail.split('\n\n').map(t=>`<p class="post-summary">${escapeHTML(t)}</p>`).join('')}${projectLink(p)}${ownerPrompt(p)}<div class="post-provenance">Shared on Telegram · <button type="button" data-action="source" data-id="${p.id}">View original</button></div>${postActions(p)}</div></article><section class="comments" id="comments"><h2 class="comments-heading">Conversation <span>${p.comments.length}</span></h2>${role==='visitor'?'<div class="signin-prompt"><span>Have a question or an idea?</span><button type="button" class="button secondary" data-action="signin">Join the conversation</button></div>':`<form id="comment-form" class="composer">${avatar(currentUser(),'tiny')}<div class="compose-body"><label class="visually-hidden" for="comment-input">Your comment</label><textarea id="comment-input" placeholder="Ask a question or add a thought…" maxlength="2000" rows="2" required></textarea><div class="compose-footer"><small>Kind, curious and on topic.</small><button type="submit" class="button" id="send-comment" disabled>Reply</button></div></div></form>`}<div id="comment-list">${p.comments.map(commentRow).join('')||'<p class="feed-subtitle" style="padding:12px 0 25px">Start the conversation.</p>'}</div></section>`;const form=document.getElementById('comment-form');if(form){const input=document.getElementById('comment-input');input.addEventListener('input',()=>document.getElementById('send-comment').disabled=!input.value.trim());input.addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.metaKey||e.ctrlKey)&&input.value.trim()){e.preventDefault();form.requestSubmit()}});form.addEventListener('submit',e=>{e.preventDefault();const text=input.value.trim();if(!text)return;p.comments.push({id:Date.now(),author:currentUser(),text,time:'Now'});const y=scrollY;renderPost();scrollTo(0,y);notify('Reply added to this preview.')})}}
function render(){updateHeader();if(route.view==='post')renderPost();else if(route.view==='profile')renderProfile();else if(route.view==='mine')renderMine();else renderFeed()}
function go(next,options={}){scrollPositions.set(location.hash||'#feed',scrollY);route=next;const hash='#'+next.view+(next.id?'/'+next.id:'');if(location.hash!==hash)history.pushState({fieldDepth:++internalDepth},'',hash);render();scrollTo({top:0,behavior:'instant'});if(options.comments)requestAnimationFrame(()=>{document.getElementById('comments')?.scrollIntoView({block:'start'});document.getElementById('comment-input')?.focus({preventScroll:true})})}
function parseRoute(){const [view,id]=location.hash.slice(1).split('/');route=['feed','saved','mine','post','profile'].includes(view)?{view,id}:{view:'feed'};if(route.view==='mine'&&role==='visitor')route={view:'feed'}}
window.addEventListener('popstate',()=>{parseRoute();internalDepth=history.state?.fieldDepth||0;render();requestAnimationFrame(()=>scrollTo({top:scrollPositions.get(location.hash||'#feed')||0,behavior:'instant'}))});
function openDialog(title,content){document.getElementById('modal-inner').innerHTML=`<div class="dialog-head"><h2 id="modal-title">${title}</h2><button type="button" class="icon-button" data-action="close-modal" aria-label="Close dialog">${icon('close')}</button></div>${content}`;if(!modal.open)modal.showModal();document.body.classList.add('modal-open')}
function closeDialog(){modal.close()}
modal.addEventListener('close',()=>document.body.classList.remove('modal-open'));
modal.addEventListener('click',e=>{if(e.target===modal){const r=modal.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeDialog()}});
function signIn(intent=null){pendingAction=intent;openDialog('Make yourself at home.',`<p class="dialog-copy">Save projects, join conversations and make your work your own.</p><div class="auth-options"><button type="button" class="auth-option" data-action="demo-login" data-provider="telegram">${icon('telegram')}Continue with Telegram</button><button type="button" class="auth-option" data-action="demo-login" data-provider="x">${icon('x')}Continue with X</button></div><p class="dialog-footnote">Design preview · uses a sample account, without connecting.</p>`)}
function editPost(p){openDialog('Edit your post.',`<form id="edit-form"><label class="field-label" for="edit-title">Title</label><input class="edit-field" id="edit-title" value="${escapeHTML(p.title)}" maxlength="120" required><label class="field-label" for="edit-summary">Short explanation</label><textarea class="edit-field" id="edit-summary" rows="4" maxlength="700" required>${escapeHTML(p.summary)}</textarea><p class="dialog-copy" style="font-size:11px;margin-top:12px">Your words stay yours. Suggested updates won’t replace them.</p><div class="dialog-actions"><button type="button" class="button secondary" data-action="close-modal">Cancel</button><button type="submit" class="button">Save changes</button></div></form>`);document.getElementById('edit-form').addEventListener('submit',e=>{e.preventDefault();const title=document.getElementById('edit-title').value.trim(),summary=document.getElementById('edit-summary').value.trim();if(!title||!summary)return;p.title=title;p.summary=summary;closeDialog();const y=scrollY;render();scrollTo(0,y);notify('Changes saved in this preview.')})}
function answerQuestion(p){openDialog('A little more context.',`<span class="question-label">Private · only you can see this</span><p class="question-title">${escapeHTML(p.question)}</p><form id="answer-form"><label class="field-label" for="answer-input">Your answer</label><textarea class="edit-field" id="answer-input" placeholder="A sentence or two is plenty." rows="4" maxlength="700" required></textarea><div class="dialog-actions"><button type="button" class="button secondary" data-action="close-modal">Later</button><button type="submit" class="button">Review addition</button></div></form>`);document.getElementById('answer-form').addEventListener('submit',e=>{e.preventDefault();const answer=document.getElementById('answer-input').value.trim();if(!answer)return;openDialog('Add this detail?',`<p class="dialog-copy">This preview adds your answer beneath the existing explanation.</p><div class="answer-context">${escapeHTML(answer)}</div><div class="dialog-actions"><button type="button" class="button secondary" data-action="close-modal">Dismiss</button><button type="button" class="button" id="accept-answer">Add to post</button></div>`);document.getElementById('accept-answer').addEventListener('click',()=>{p.detail+='\n\n'+answer;p.question=null;closeDialog();render();notify('Detail added to your post.')})})}
async function sharePost(p){const url=location.href.split('#')[0]+'#post/'+p.id;try{await navigator.clipboard.writeText(url);notify('Link to this preview copied.')}catch{openDialog('Share this preview.',`<p class="dialog-copy">Copy the local link to this post.</p><label class="field-label" for="share-url">Post link</label><input class="edit-field" id="share-url" readonly value="${escapeHTML(url)}">`);document.getElementById('share-url').select()}}
document.addEventListener('click',e=>{const b=e.target.closest('button[data-action],button[data-route]');if(!b)return;const action=b.dataset.action,id=b.dataset.id,p=posts.find(p=>p.id===id);
  if(b.dataset.route){if(b.dataset.route==='mine'&&role==='visitor'){signIn();return}search='';searchOpen=false;go({view:b.dataset.route});return}
  if(action==='post')go({view:'post',id});
  if(action==='comments')go({view:'post',id},{comments:true});
  if(action==='profile')go({view:'profile',id});
  if(action==='back'){if(history.state?.fieldDepth>0)history.back();else go({view:'feed'})}
  if(action==='reset-feed'){search='';searchOpen=false;go({view:'feed'})}
  if(action==='search'){searchOpen=!searchOpen;if(!searchOpen)search='';renderFeed();if(searchOpen)document.getElementById('search-input').focus()}
  if(action==='close-search'){searchOpen=false;search='';renderFeed();document.querySelector('[data-action="search"]').focus()}
  if(action==='signin')signIn();
  if(action==='demo-login'){role=b.dataset.provider==='telegram'?'author':'member';const intent=pendingAction;pendingAction=null;if(intent?.type==='save')saved.add(intent.id);closeDialog();render();if(route.view==='post')document.getElementById('comment-input')?.focus({preventScroll:true});notify(intent?.type==='save'?'Signed in. Project saved for later.':role==='author'?'Previewing Alex’s Telegram account.':'Previewing a member account.')}
  if(action==='close-modal')closeDialog();
  if(action==='save'&&p){if(role==='visitor'){signIn({type:'save',id});return}const wasSaved=saved.has(id);wasSaved?saved.delete(id):saved.add(id);if((route.view==='saved'&&wasSaved)||(['feed','saved'].includes(route.view)&&sort==='bookmarks')){const y=scrollY;renderList();scrollTo(0,y)}else{const selector=`[data-action="save"][data-id="${id}"]`;document.querySelectorAll(selector).forEach(button=>{button.classList.toggle('saved',!wasSaved);button.setAttribute('aria-pressed',String(!wasSaved));button.setAttribute('aria-label',(wasSaved?'Save ':'Unsave ')+p.title)})}notify(wasSaved?'Removed from saved.':'Saved for later.')}
  if(action==='share'&&p)sharePost(p);
  if(action==='project'&&p)notify('Sample project. This link will open the creator’s website.');
  if(action==='source')notify('Sample source. This link will open the original Telegram message.');
  if(action==='menu'&&p)openDialog('Post options',`<div class="menu-options"><button type="button" data-action="source" data-id="${id}">${icon('telegram')}View original on Telegram</button><button type="button" data-action="share" data-id="${id}">${icon('link')}Copy post link</button>${role!=='visitor'&&p.author===currentUser()?`<button type="button" data-action="edit" data-id="${id}">${icon('edit')}Edit post</button><button type="button" data-action="remove" data-id="${id}">${icon('trash')}Remove post</button>`:`<button type="button" data-action="report" data-id="${id}">${icon('flag')}Report an issue</button>`}</div>`);
  if(action==='report'){openDialog('What needs attention?',`<p class="dialog-copy">Flag incorrect attribution, an inaccurate summary or inappropriate content.</p><label class="field-label" for="report-text">A short explanation</label><textarea class="edit-field" id="report-text" rows="3" placeholder="What should we take a look at?"></textarea><div class="dialog-actions"><button type="button" class="button secondary" data-action="close-modal">Cancel</button><button type="button" class="button" data-action="send-report">Send report</button></div>`)}
  if(action==='send-report'){closeDialog();notify('Preview only. No report was sent.')}
  if(action==='edit'&&p&&role!=='visitor'&&p.author===currentUser())editPost(p);
  if(action==='question'&&p&&role!=='visitor'&&p.author===currentUser())answerQuestion(p);
  if(action==='remove'&&p&&role!=='visitor'&&p.author===currentUser()){openDialog('Remove this post?',`<p class="dialog-copy">“${escapeHTML(p.title)}” will disappear from this preview.</p><div class="dialog-actions"><button type="button" class="button secondary" data-action="close-modal">Keep post</button><button type="button" class="button" data-action="confirm-remove" data-id="${id}">Remove</button></div>`)}
  if(action==='confirm-remove'&&p&&role!=='visitor'&&p.author===currentUser()){posts=posts.filter(item=>item.id!==id);saved.delete(id);closeDialog();render();notify('Post removed from this preview.')}
  if(action==='delete-comment'){const post=posts.find(post=>post.id===route.id);if(post){post.comments=post.comments.filter(c=>!(String(c.id)===id&&c.author===currentUser()&&role!=='visitor'));const y=scrollY;renderPost();scrollTo(0,y);notify('Your comment was removed.')}}
  if(action==='account')openDialog('Your account',`<div style="display:flex;align-items:center;gap:12px;margin-top:20px">${avatar(currentUser())}<div><strong style="font-size:13px">${people[currentUser()].name}</strong><p class="dialog-copy" style="font-size:11px">Sample ${role==='author'?'Telegram author':'member'} account</p></div></div><div class="menu-options"><button type="button" data-action="my-posts">${icon('user')}Your posts</button><button type="button" data-action="signout">${icon('back')}Sign out</button></div>`);
  if(action==='my-posts'){closeDialog();go({view:'mine'})}
  if(action==='signout'){role='visitor';closeDialog();if(route.view==='mine')route={view:'feed'};render();notify('Signed out of the preview.')}
});
document.getElementById('preview-role').addEventListener('change',e=>{role=e.target.value;if(route.view==='mine'&&role==='visitor')route={view:'feed'};render()});
document.addEventListener('keydown',e=>{const editing=e.target.matches('input,textarea,select,[contenteditable]');if(e.key==='/'&&!editing&&!modal.open){e.preventDefault();if(!['feed','saved'].includes(route.view))go({view:'feed'});searchOpen=true;renderFeed();document.getElementById('search-input').focus()}if(e.key==='Escape'&&!modal.open&&searchOpen&&['feed','saved'].includes(route.view)){searchOpen=false;search='';renderFeed();document.querySelector('[data-action="search"]')?.focus()}});
document.querySelector('.brand').addEventListener('click',e=>{e.preventDefault();search='';searchOpen=false;go({view:'feed'})});
parseRoute();render();
</script>
</body>
</html>
